<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KOINOS — Account</title><link rel="stylesheet" href="./pages.css"></head><body><header class="topbar"><a class="brand" href="/"><span class="brand-mark">K</span>KOINOS</a><nav class="nav"><a href="/">Home</a><a href="/live.html">Live issues</a><a href="/track.html">Track a report</a></nav></header><main class="page"><section class="panel panel-pad auth"><p class="eyebrow">KOINOS account</p><h1 style="font-size:52px">Your civic<br><em>identity.</em></h1><p class="muted">Use a real email address to create an account, verify it, sign in and keep your reports together.</p><div class="auth-tabs"><button class="auth-tab active" data-mode="signin">Sign in</button><button class="auth-tab" data-mode="signup">Create account</button></div><form id="auth-form"><label>Email<input id="email" type="email" autocomplete="email" required></label><label>Password<input id="password" type="password" minlength="6" autocomplete="current-password" required></label><div class="form-actions"><button class="btn btn-dark" type="submit" id="submit">Sign in</button><button class="btn hidden" type="button" id="reset">Reset password</button></div></form><p id="auth-message" class="notice" style="margin-top:16px">Your email is handled by Supabase Auth; KOINOS never sees your password.</p></section></main><script src="./supabase-config.js"></script><script src="./auth.js"></script><script>let mode='signin';const f=document.querySelector('#auth-form'),msg=document.querySelector('#auth-message'),submit=document.querySelector('#submit'),reset=document.querySelector('#reset');const redirect=location.origin+'/auth.html';document.querySelectorAll('.auth-tab').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('.auth-tab').forEach(x=>x.classList.toggle('active',x===b));submit.textContent=mode==='signin'?'Sign in':'Create account';reset.classList.toggle('hidden',mode!=='signin')});f.onsubmit=async e=>{e.preventDefault();const c=await window.KOINOS_AUTH_READY;if(!c){msg.textContent='Add your Supabase Project URL and publishable/anon key to supabase-config.js first.';return}const email=document.querySelector('#email').value.trim(),password=document.querySelector('#password').value;const r=mode==='signin'?await c.auth.signInWithPassword({email,password}):await c.auth.signUp({email,password,options:{emailRedirectTo:redirect,data:{display_name:email.split('@')[0]}}});if(r.error){msg.textContent=r.error.message;return}if(mode==='signin'){msg.textContent='Signed in. Redirecting…';setTimeout(()=>location.href='/track.html',400)}else{msg.textContent=r.data.session?'Account created. You are signed in.':'Account created. Check your email to verify your account.'}};reset.onclick=async()=>{const c=await window.KOINOS_AUTH_READY;if(!c)return;const email=document.querySelector('#email').value.trim();if(!email)return msg.textContent='Enter your email first.';const r=await c.auth.resetPasswordForEmail(email,{redirectTo:redirect});msg.textContent=r.error?.message||'Password reset email sent.'};</script></body></html>
