<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#20211f"><title>KOINOS — Report an issue</title><link rel="stylesheet" href="./pages.css"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"></head><body><header class="topbar"><a class="brand" href="/"><span class="brand-mark">K</span>KOINOS</a><nav class="nav"><a href="/">Home</a><a href="/live.html">Live issues</a><a href="/track.html">Track a report</a></nav><div class="actions"><a class="btn" href="/auth.html">Sign in</a></div></header><main class="page"><section class="hero-mini"><p class="eyebrow">Report · 01 / 03</p><h1>Show us what<br><em>needs fixing.</em></h1><p class="lede">A photo, a precise location and a few words are enough. KOINOS checks nearby reports so duplicate complaints become one stronger community signal.</p></section><section class="panel panel-pad report-form"><label>Photo<input id="photo" type="file" accept="image/*" capture="environment"><span id="file-note" class="muted">Images are automatically resized for reliable mobile upload.</span></label><img id="preview" class="preview hidden" alt="Selected report photo"><label>What is wrong?<select id="category"><option value="road">Road / pothole</option><option value="water">Water / drainage</option><option value="waste">Garbage / waste</option><option value="streetlight">Streetlight / electricity</option><option value="other">Other</option></select><textarea id="description" placeholder="Example: Deep pothole near the school gate; two-wheelers are swerving around it."></textarea></label><label>Exact location<div id="report-map" class="location-map"></div><div class="location-tools"><input id="search" placeholder="Search road, landmark or area"><button class="btn" type="button" id="gps">⌖ Use my location</button></div><span id="location-note" class="muted">Tap the map or use your location.</span></label><label class="check-row"><input id="anonymous" type="checkbox"> Report anonymously</label><button class="btn btn-accent" id="submit" type="button">Submit report →</button><p id="message" class="notice">Your report will be stored in the KOINOS civic database.</p></section></main><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="./site-config.js"></script><script src="./supabase-config.js"></script><script src="./auth.js"></script><script src="./report-page.js"></script></body></html>
