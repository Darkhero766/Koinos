<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KOINOS — Track your reports</title><link rel="stylesheet" href="./pages.css?v=20260906-11"></head><body><header class="topbar"><a class="brand" href="/"><span class="brand-mark">K</span>KOINOS</a><nav class="nav"><a href="/">Home</a><a href="/live.html">Live issues</a><a class="active" href="/track.html">Track a report</a></nav><div class="actions"><span class="mono" data-user-email>Guest</span><a class="btn" data-signin href="/auth.html">Sign in</a><button class="btn btn-dark hidden" data-signout type="button">Sign out</button></div></header><main class="page"><section class="hero-mini"><p class="eyebrow">03 / Track</p><h1>Your reports.<br><em>Your follow-through.</em></h1><p class="lede">See reports submitted from this device, plus your account history when you sign in.</p></section><section id="auth-gate" class="panel panel-pad hidden"></section><section id="reports" class="issues track-card"></section></main><script src="./supabase-config.js?v=20260906-11"></script><script src="./auth.js?v=20260906-11"></script><script src="./civic-db.js?v=20260906-11"></script><script>(async()=>{const host=document.querySelector('#reports'),gate=document.querySelector('#auth-gate');const esc=x=>String(x??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));const wait=ms=>new Promise(r=>setTimeout(r,ms));try{const c=await window.KOINOS_AUTH_READY;if(!c){host.innerHTML='<div class="panel panel-pad"><h2 style="font-size:32px">Account service unavailable.</h2><p class="muted">Supabase is not configured on this deployment.</p></div>';return;}let items=[];for(let n=0;n<3;n++){try{items=await window.KOINOS_DB.listMine();break}catch(e){if(n===2)throw e;await wait(250)}}if(!items.length){const signed=Boolean((await c.auth.getSession()).data?.session);host.innerHTML=`<div class="panel panel-pad"><h2 style="font-size:32px">No reports yet.</h2><p class="muted">${signed?'Your account has no reports yet.':'Reports submitted anonymously on this device will appear here automatically.'}</p><div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:18px"><a class="btn btn-accent" href="/report.html">+ Report an issue</a>${signed?'':'<a class="btn" href="/auth.html">Create account</a>'}</div></div>`;return;}host.innerHTML=items.map(i=>`<article class="panel panel-pad"><div class="issue-top"><span class="tag ${i.severity==='high'?'tag-high':i.severity==='medium'?'tag-medium':'tag-low'}">${esc(String(i.status||'reported').replaceAll('_',' '))}</span><span class="mono">${i.anonymous?'Anonymous':'Account report'} · Priority ${i.priority??0}</span></div><h2 style="font-size:30px">${esc(i.title||'Civic issue')}</h2><p class="muted">${esc(i.locationLabel||'Pinned location')}</p>${i.photoUrl?`<img class="issue-img" src="${esc(i.photoUrl)}" alt="Your report photo" loading="lazy">`:''}<div class="timeline"><div class="event"><span class="event-line"></span><div><div class="status">Reported</div><div class="muted">${new Date(i.createdAt).toLocaleString('en-IN')}</div></div></div><div class="event"><span class="event-line"></span><div><div class="status">Current status: ${esc(String(i.status||'reported').replaceAll('_',' '))}</div><div class="muted">${new Date(i.updatedAt||i.createdAt).toLocaleString('en-IN')}</div></div></div></div></article>`).join('');}catch(e){console.error('KOINOS track:',e);host.innerHTML=`<div class="notice">Could not load your reports: ${esc(e.message||e)}<br><button class="btn" style="margin-top:12px" onclick="location.reload()">Retry</button></div>`}})();</script></body></html>
